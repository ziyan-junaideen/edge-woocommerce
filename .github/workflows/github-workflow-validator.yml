name: Github Workflow Validator

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      # Installed from the release binary rather than through asdf: the asdf
      # action clones asdf's master branch, which is now a Go program with no
      # `asdf` shell script to source, so the install step fails outright.
      - name: Install action-validator
        env:
          ACTION_VALIDATOR_VERSION: v0.5.4
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL \
            "https://github.com/mpalmer/action-validator/releases/download/${ACTION_VALIDATOR_VERSION}/action-validator_linux_amd64" \
            -o "${RUNNER_TEMP}/bin/action-validator"
          chmod +x "${RUNNER_TEMP}/bin/action-validator"
          "${RUNNER_TEMP}/bin/action-validator" --version
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Lint Actions
        continue-on-error: true
        id: validator
        run: |
          ISSUES=$(cat << EOF
          `action-validator .github/workflows/* 2>&1`
          EOF
          )
          echo "ISSUES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ISSUES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Comment workflow validator results
        uses: thollander/actions-comment-pull-request@v3
        if:  ${{ (github.ref != 'refs/heads/main') }}
        with:
          message: |
            ```
            ${{ steps.validator.outputs.issues }}
            ```
          comment_tag: validator
